<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片分享功能测试</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      padding: 40px;
      color: #36302b;
    }
    h1 { margin-bottom: 20px; }
    .test-area {
      background: #fff;
      border: 1px solid #e8e6dc;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    button {
      background: #be2c2c;
      color: #fff4f0;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 8px;
    }
    button:hover { background: #a02424; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      color: #36302b;
      border: 1px solid #e8e6dc;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      background: #f0e9dc;
      border-radius: 4px;
      font-size: 14px;
    }
    .preview {
      margin-top: 24px;
      border: 1px solid #e8e6dc;
      border-radius: 8px;
      overflow: hidden;
    }
    .preview img {
      max-width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <h1>图片分享功能测试</h1>

  <div class="test-area">
    <p>这个页面用于测试图片分享功能，不需要 API 连接。</p>
    <p>点击下方按钮生成测试图片：</p>
    <button id="generateBtn">生成测试图片</button>
    <button id="clearBtn" class="secondary">清除预览</button>
    <div id="status"></div>
  </div>

  <div class="preview" id="preview" style="display: none;">
    <img id="previewImg" alt="预览">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const testMessages = [
      { role: "user", content: "什么是唯物辩证法？它在实际生活中有什么应用？" },
      { role: "assistant", content: "唯物辩证法是一种哲学方法，强调事物的矛盾运动和发展变化。它认为世界是物质的，物质是运动的，运动是有规律的。", kind: "answer" },
      { role: "user", content: "能举个具体的例子吗？" },
      { role: "assistant", content: "比如在工作中遇到困难时，唯物辩证法告诉我们：困难和顺利是矛盾的两个方面，它们相互依存、相互转化。通过分析矛盾的特殊性，找到解决问题的具体方法，就能把困难转化为顺利。", kind: "answer" }
    ];

    function getMessageLabel(message) {
      if (message.role === "user") return "你";
      const kind = message.kind || "answer";
      if (kind === "follow_up") return "追问";
      if (kind === "reject") return "边界";
      return "分析";
    }

    function createShareCardElement(selectedMessages, pageTitle) {
      const card = document.createElement("div");
      card.style.cssText = `
        background: #f5f5f5;
        font-family: "Noto Sans SC", "PingFang SC", -apple-system, "Helvetica Neue", Arial, sans-serif;
        padding: 32px;
        width: 1080px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-sizing: border-box;
      `;

      // Header: avatar + brand | tagline
      const header = document.createElement("div");
      header.style.cssText = `
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 4px;
      `;

      const headerLeft = document.createElement("div");
      headerLeft.style.cssText = "display: flex; align-items: center; gap: 18px;";

      const avatar = document.createElement("img");
      avatar.style.cssText = `
        width: 60px; height: 60px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        background: #ddd;
      `;
      avatar.src = "/img/avatar.png";
      avatar.alt = "头像";
      avatar.crossOrigin = "anonymous";

      const brandInfo = document.createElement("div");
      brandInfo.style.cssText = "display: flex; flex-direction: column; gap: 6px;";

      const brandNameEl = document.createElement("span");
      brandNameEl.style.cssText = "font-size: 26px; font-weight: 700; color: #222;";
      brandNameEl.textContent = "希路路克";

      const brandDescEl = document.createElement("span");
      brandDescEl.style.cssText = "font-size: 15px; color: #999;";
      brandDescEl.textContent = "记录我关心的事物，也理解它们。";

      brandInfo.append(brandNameEl, brandDescEl);
      headerLeft.append(avatar, brandInfo);

      const tagline = document.createElement("span");
      tagline.style.cssText = "font-size: 15px; color: #999; letter-spacing: 0.06em; flex-shrink: 0;";
      tagline.textContent = "深度思考 · 理性分析 · 建设性建议";

      header.append(headerLeft, tagline);

      // Messages
      selectedMessages.forEach(function(msg) {
        var isUser = msg.role === "user";

        const section = document.createElement("div");
        section.style.cssText = `
          background: ${isUser ? "#fef8ec" : "#ffffff"};
          border-radius: 18px;
          padding: 28px 32px;
        `;

        const badgeRow = document.createElement("div");
        badgeRow.style.cssText = "display: flex; align-items: center; gap: 14px; margin-bottom: 18px;";

        const badge = document.createElement("div");
        badge.style.cssText = `
          width: 38px; height: 38px;
          border-radius: 50%;
          background: ${isUser ? "#c89045" : "#5b90d9"};
          display: flex; align-items: center; justify-content: center;
          font-size: 18px; font-weight: 700; color: #fff;
          flex-shrink: 0; line-height: 1;
        `;
        badge.textContent = isUser ? "问" : "答";

        const labelText = document.createElement("span");
        labelText.style.cssText = "font-size: 20px; font-weight: 600; color: " + (isUser ? "#c89045" : "#5b90d9") + ";";
        labelText.textContent = isUser ? "提问" : "回答";

        badgeRow.append(badge, labelText);

        const body = document.createElement("p");
        body.style.cssText = "margin: 0; font-size: 24px; line-height: 1.8; white-space: pre-wrap; color: #222;";
        body.textContent = msg.content;

        section.append(badgeRow, body);
        card.append(section);
      });

      // Footer: avatar + brand + desc | cta + QR code
      const footer = document.createElement("div");
      footer.style.cssText = `
        background: #eeeeee;
        border-radius: 18px;
        padding: 20px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      `;

      const footerLeft = document.createElement("div");
      footerLeft.style.cssText = "display: flex; align-items: center; gap: 10px;";

      const footerAvatar = document.createElement("img");
      footerAvatar.style.cssText = `
        width: 36px; height: 36px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        background: #ddd;
      `;
      footerAvatar.src = "/img/avatar.png";
      footerAvatar.alt = "头像";
      footerAvatar.crossOrigin = "anonymous";

      const footerBrandInfo = document.createElement("div");
      footerBrandInfo.style.cssText = "display: flex; flex-direction: column; gap: 4px;";

      const footerBrandName = document.createElement("span");
      footerBrandName.style.cssText = "font-size: 19px; font-weight: 600; color: #333;";
      footerBrandName.textContent = "希路路克";

      const footerBrandSub = document.createElement("span");
      footerBrandSub.style.cssText = "font-size: 13px; color: #999;";
      footerBrandSub.textContent = "记录我关心的事物，也理解它们。";

      footerBrandInfo.append(footerBrandName, footerBrandSub);
      footerLeft.append(footerAvatar, footerBrandInfo);

      const footerRight = document.createElement("div");
      footerRight.style.cssText = "display: flex; align-items: center; gap: 14px;";

      const ctaText = document.createElement("span");
      ctaText.style.cssText = "font-size: 16px; color: #999;";
      ctaText.textContent = "长按识别二维码 → 向我提问";

      const qrBlock = document.createElement("div");
      qrBlock.style.cssText = `
        width: 56px; height: 56px;
        border-radius: 6px; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        background: #fff; font-size: 10px; color: #999; text-align: center;
      `;
      qrBlock.textContent = "二维码";

      footerRight.append(ctaText, qrBlock);
      footer.append(footerLeft, footerRight);

      // Assemble
      const sections = Array.from(card.children);
      card.innerHTML = "";
      card.append(header);
      sections.forEach(function(el) { card.append(el); });
      card.append(footer);

      return card;
    }

    async function generateImage() {
      const statusEl = document.getElementById("status");
      const previewEl = document.getElementById("preview");
      const previewImg = document.getElementById("previewImg");
      const generateBtn = document.getElementById("generateBtn");

      generateBtn.disabled = true;
      generateBtn.textContent = "生成中...";
      statusEl.textContent = "正在生成图片...";

      try {
        const card = createShareCardElement(testMessages, "测试对话");

        const container = document.createElement("div");
        container.style.cssText = `
          position: fixed;
          left: 0;
          top: 0;
          width: 1080px;
          z-index: 10000;
          opacity: 0;
          pointer-events: none;
        `;
        container.append(card);
        document.body.append(container);

        await new Promise(r => setTimeout(r, 200));

        const cardHeight = card.scrollHeight;
        const canvas = await html2canvas(card, {
          scale: 2,
          backgroundColor: "#f5f5f5",
          useCORS: true,
          logging: false,
          width: 1080,
          height: cardHeight,
          windowWidth: 1080,
        });

        const dataUrl = canvas.toDataURL("image/png");
        previewImg.src = dataUrl;
        previewEl.style.display = "block";
        statusEl.textContent = "图片生成成功！可以右键保存图片。";

        container.remove();
      } catch (error) {
        statusEl.textContent = "生成失败: " + error.message;
        console.error(error);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = "生成测试图片";
      }
    }

    document.getElementById("generateBtn").addEventListener("click", generateImage);
    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("preview").style.display = "none";
      document.getElementById("status").textContent = "";
    });
  </script>
</body>
</html>
