{{ if gt .TotalPages 1 }}
<div class="pagination">
  {{ if .HasPrev }}
  <div class="pagination-control">
    <a href="{{ .Prev.URL | absURL }}">
      上一页
    </a>
  </div>
  {{ end }}
  <div class="page-number">
    <p>{{ .PageNumber }}/{{ .TotalPages }}</p>
  </div>
  {{ if .HasNext }}
  <div class="pagination-control">
    <a href="{{ .Next.URL | absURL }}">
      下一页
    </a>
  </div>
  {{ end }}
</div>
{{ end }}
