# -------------------------------------------------------------
# About 页内容源（改文案只动这里，不要碰模板）
# -------------------------------------------------------------

hero:
  # 主标题：About / Luxi
  label: "About"
  name: "Luxi"
  # 正文段落（支持多段，顺序展示）
  paragraphs:
    - "你好，我是 Luxi。"
    - "这是我的个人说明书，也是这个站点最接近「自我介绍」的一页。"
  # 事实条（图标 + 一句话）
  facts:
    - icon: location       # 地图图钉
      text: "02 年生，四川人，现居成都。"
    - icon: calendar       # 日历
      text: "我长期写作，也在认真地生活。"
  # Hero 底部总结
  summary: "这个站点用来记录我关心的事物，也用来整理我对生活的理解。"

# -------------------------------------------------------------
# 主题卡（顺序 = 渲染顺序）
# type: bullets (圆点列表) 或 paragraphs (段落)
# image: assets/img/about/ 下的文件名
# icon:  book / target / pencil
# -------------------------------------------------------------
sections:
  - key: care
    title: "我关心什么"
    icon: book
    image: care.png
    type: bullets
    items:
      - "极简主义，以及如何过一种更简单、更有秩序的生活"
      - "阅读、影视和历史，以及它们如何塑造一个人的判断"
      - "写作、自我管理、身体训练，以及长期主义在日常中的落实"
      - "技术产品和真正能够改善生活体验的工具"

  - key: how
    title: "我如何做事"
    icon: target
    image: how.png
    type: bullets
    items:
      - "我喜欢先把事情想清楚，再决定怎么做"
      - "我重视规律、结构和长期积累，不太迷信短期的热情"
      - "我偏爱简单、有效、可持续的方式，不喜欢把问题复杂化"
      - "我愿意听，也愿意分析；比起情绪宣泄，我更习惯理解问题本身"

  - key: why
    title: "我为什么写"
    icon: pencil
    image: why.png
    type: paragraphs
    items:
      - "我写作，不只是为了表达。"
      - "更准确地说，写作是我理解生活、整理经验、校准自己的方式。"

# -------------------------------------------------------------
# 底部 Quote 卡（占位，后面再改）
# -------------------------------------------------------------
quote:
  text: "写作是我对生活最诚实的一次复盘。"
  author: "Luxi"
