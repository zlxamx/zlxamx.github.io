{{ $showFooter := default true .Site.Params.showFooter }}
{{ if $showFooter }}
<div class="footer-inner">
  <p class="footer-copy">© {{ now.Year }} {{ .Site.Params.author | default .Site.Title }}</p>
  <a class="footer-library-link" href="{{ "/library" | relURL }}" title="Library">
    <svg class="footer-library-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </svg>
  </a>
</div>
{{ end }}
