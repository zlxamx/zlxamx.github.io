name: Deploy Dialectics Proxy

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/deploy-dialectics-proxy.yml"
      - "runtime/materialist-dialectics-proxy/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "deploy=true" >> "${GITHUB_OUTPUT}"

      - name: Deploy Worker
        if: steps.guard.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "runtime/materialist-dialectics-proxy"

      - name: Skip deploy
        if: steps.guard.outputs.deploy != 'true'
        run: echo "Skipping proxy deployment because required Cloudflare credentials are missing."
