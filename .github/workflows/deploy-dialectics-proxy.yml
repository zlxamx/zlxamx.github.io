name: Deploy Dialectics Proxy

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/deploy-dialectics-proxy.yml"
      - "runtime/materialist-dialectics-proxy/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check required secrets
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "deploy=true" >> "${GITHUB_OUTPUT}"

      - name: Install Wrangler
        if: steps.guard.outputs.deploy == 'true'
        working-directory: runtime/materialist-dialectics-proxy
        run: npm install --no-fund --no-audit

      - name: Sync DeepSeek secret
        if: steps.guard.outputs.deploy == 'true' && secrets.DEEPSEEK_API_KEY != ''
        working-directory: runtime/materialist-dialectics-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: printf '%s' "${DEEPSEEK_API_KEY}" | npx wrangler secret put DEEPSEEK_API_KEY

      - name: Sync OpenAI secret
        if: steps.guard.outputs.deploy == 'true' && secrets.OPENAI_API_KEY != ''
        working-directory: runtime/materialist-dialectics-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "${OPENAI_API_KEY}" | npx wrangler secret put OPENAI_API_KEY

      - name: Deploy Worker
        if: steps.guard.outputs.deploy == 'true'
        working-directory: runtime/materialist-dialectics-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Skip deploy
        if: steps.guard.outputs.deploy != 'true'
        run: echo "Skipping proxy deployment because required Cloudflare credentials are missing."
