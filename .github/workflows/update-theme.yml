name: Update theme

# Controls when the workflow will run
on:
  schedule:
    # Update theme automatically everyday at 00:00 UTC
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-theme:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.154.2

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      # Keep theme maintenance on the same Hugo version as production and avoid
      # the flaky third-party setup step that has been returning transient 502s.
      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/bin" "${RUNNER_TEMP}/hugo"
          curl --fail --location \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            --output "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${RUNNER_TEMP}/hugo" -xf "${RUNNER_TEMP}/hugo.tar.gz"
          install "${RUNNER_TEMP}/hugo/hugo" "${HOME}/.local/bin/hugo"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          hugo version

      - name: Update theme
        run: hugo mod get -u

      - name: Tidy go.mod, go.sum
        run: hugo mod tidy

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CI: Update theme"
