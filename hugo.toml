baseURL = "https://luxi.blog/"
languageCode = "zh-cn"
title = "LuxiBlog"
theme = "typo"
enableRobotsTXT = true

hasCJKLanguage = true

[pagination]
  pagerSize = 10

[params]
description = "我是 Luxi，一个认真生活的人。这里记录我关心的事物，也记录我如何理解它们。"
author = "Luxi"
homeIntroTitle = "我是 Luxi，一个认真生活的人。"
homeIntroContent = """
这里记录我关心的事物，也记录我如何理解它们。
"""
homeCollection = "post"
homeCollectionTitle = "Writing"
paginationSize = 10
listSummaries = false
listDateFormat = "2006-01-02"
singleDateFormat = "2006年01月02日"
colorPalette = "cactus"
themeColor = "#ffffff"
mainSections = ["post"]
footerContent = "愿你也能认真生活，慢慢理解自己。"
homeQuote = "生活的意义不在于抵达某个终点，而在于理解沿途的风景。"
homeQuoteAuthor = "Luxi"
homeInterests = ["写作", "阅读", "极简主义", "历史", "数码产品", "长期主义"]

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false

[params.breadcrumbs]
enabled = false

[params.waline]
enable = true
serverURL = "https://luxi-blog-bice.vercel.app"
lang = "zh-CN"
meta = ["nick", "mail"]
requiredMeta = ["nick", "mail"]
login = "disable"
emoji = false
search = false
reaction = false
commentSorting = "latest"

[params.materialistDialectics]
apiPath = "/api/materialist-dialectics/chat"
apiURL = ""
storageKey = "materialist-dialectics-chat"
inputLimit = 1600
maxHistoryMessages = 8

[[params.social]]
name = "github"
url = "https://github.com/zlxamx"

[[params.social]]
name  = "rss"
url   = "/index.xml"
title = "RSS 订阅"

[[params.social]]
name  = "jike"
url   = "https://okjk.co/0BEcqW"
title = "即刻"

[[params.menu]]
name = "写作"
url = "/post"
weight = 2

[[params.menu]]
name = "来信"
url = "/weekly"
weight = 3

[[params.menu]]
name = "辩证"
url = "/dialectics"
weight = 5

[[params.menu]]
name = "关于我"
url = "/about"
weight = 7
