baseURL = "https://luxi.blog/"
languageCode = "zh-cn"
title = "LuxiBlog"
theme = "typo"
enableRobotsTXT = true

hasCJKLanguage = true

[pagination]
  pagerSize = 10

[params]
description = "我是 Luxi，一个认真生活的人。这里记录我关心的事物，也记录我如何理解它们。"
author = "Luxi"
homeIntroTitle = "我是 Luxi，一个认真生活的人。"
homeIntroContent = """
这里记录我关心的事物，也记录我如何理解它们。
"""
homeCollection = "post"
homeCollectionTitle = "Writing"
paginationSize = 10
listSummaries = false
listDateFormat = "2006-01-02"
singleDateFormat = "2006年01月02日"
colorPalette = "linen"
themeColor = "#ffffff"
mainSections = ["post"]
footerContent = "愿你也能认真生活，慢慢理解自己。"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false

[params.breadcrumbs]
enabled = false

[params.waline]
enable = true
serverURL = "https://luxi-blog-bice.vercel.app"
lang = "zh-CN"
meta = ["nick", "mail"]
requiredMeta = ["nick", "mail"]
login = "disable"
emoji = false
search = false
reaction = false
commentSorting = "latest"

[params.materialistDialectics]
apiPath = "/api/materialist-dialectics/chat"
apiURL = ""
storageKey = "materialist-dialectics-chat"
inputLimit = 1600
maxHistoryMessages = 8

[[params.social]]
name = "github"
url = "https://github.com/zlxamx"

[[params.menu]]
name = "Home"
url = "/"
weight = 1

[[params.menu]]
name = "Writing"
url = "/post"
weight = 2

[[params.menu]]
name = "Letters"
url = "/weekly"
weight = 3

[[params.menu]]
name = "Dialectics"
url = "/dialectics"
weight = 5

[[params.menu]]
name = "Now"
url = "/now"
weight = 6

[[params.menu]]
name = "About"
url = "/about"
weight = 7
